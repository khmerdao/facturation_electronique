doctrine:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # DBAL — connexion MySQL 8.0+ / MariaDB 10.6+
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # MySQL : désactiver le mode STRICT pour les valeurs par défaut vides
        # (Symfony recommande de garder strict_mode: true en production)
        use_savepoints: true
        # UUID stocké en CHAR(36) — Doctrine le gère via le type 'uuid'
        # qui sérialise/désérialise Symfony\Component\Uid\Uuid ↔ string
        types:
            uuid:
                class: Symfony\Bridge\Doctrine\Types\UuidType
                commented: false

        # MySQL utilise 'string' pour les CHAR(36) annotés DC2Type:uuid
        mapping_types:
            char: string

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ORM
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true

        # Mappings PSR-4 des entités
        mappings:
            App:
                is_bundle: false
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

        # ── Filtres Doctrine (multi-tenant isolation) ─────────────────
        filters:
            # TenantFilter applique automatiquement WHERE tenant_id = :current_tenant
            # sur toutes les entités qui portent TenantAwareTrait.
            # Activé par TenantFilterSubscriber après chaque requête authentifiée.
            tenant_filter:
                class: App\Doctrine\Filter\TenantFilter
                enabled: false  # activé dynamiquement par TenantFilterSubscriber

        # ── Second Level Cache (SLC) — désactivé en dev ───────────────
        # second_level_cache:
        #     enabled: true
        #     region_cache_driver:
        #         type: pool
        #         pool: doctrine.system_cache_pool

        # ── Controller argument resolver ──────────────────────────────
        controller_resolver:
            auto_mapping: true
