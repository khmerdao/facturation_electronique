monolog:
    channels:
        - deprecation
        - audit        # logs d'audit piste fiable (rétention 10 ans)
        - pdp          # transmissions PDP/PPF
        - ereporting   # e-reporting DGFiP
        - security     # événements de sécurité

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']
            audit:
                type: stream
                path: '%kernel.logs_dir%/audit.log'
                level: info
                channels: [audit]
            pdp:
                type: stream
                path: '%kernel.logs_dir%/pdp.log'
                level: debug
                channels: [pdp]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            # Logs d'audit : fichier dédié + rotation mensuelle (rétention 10 ans)
            audit:
                type: rotating_file
                path: '%kernel.logs_dir%/audit.log'
                level: info
                channels: [audit]
                max_files: 120  # 10 ans (12 mois × 10 ans)
                formatter: monolog.formatter.json
            # Logs PDP : rotation hebdomadaire
            pdp:
                type: rotating_file
                path: '%kernel.logs_dir%/pdp.log'
                level: info
                channels: [pdp, ereporting]
                max_files: 52   # 1 an
                formatter: monolog.formatter.json
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
