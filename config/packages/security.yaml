security:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Encodage des mots de passe (bcrypt auto-upgrade)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
            cost: 13

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Providers — source de vérité des utilisateurs
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    providers:
        # Provider principal : lookup par email (UserInterface)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Firewalls
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    firewalls:
        # ── Firewall de développement (profiler, assets) ───────────────
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # ── Firewall Super-Admin (accès /admin/* séparé) ───────────────
        # Session dédiée, pas de JWT. Accès uniquement si ROLE_SUPER_ADMIN.
        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\Authenticator\AdminFormAuthenticator
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: /admin/tenants
                enable_csrf: true
            logout:
                path: admin_logout
                target: admin_login
            two_factor:
                auth_form_path: admin_2fa_login
                check_path: admin_2fa_login_check
                remember_me_sets_cookie: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800  # 7 jours
                path: /admin

        # ── Firewall API — JWT stateless ───────────────────────────────
        # Utilisé par les intégrations tierces (clés API, apps mobiles)
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\Authenticator\ApiKeyAuthenticator
                - lexik_jwt_authentication.jwt_token_authenticator
            entry_point: lexik_jwt_authentication.jwt_token_authenticator

        # ── Firewall principal — session + 2FA ─────────────────────────
        main:
            lazy: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\Authenticator\AppAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: /dashboard
                username_parameter: email
                password_parameter: password
                enable_csrf: true
            logout:
                path: app_logout
                target: /login
            two_factor:
                auth_form_path: app_2fa_login
                check_path: app_2fa_login_check
                remember_me_sets_cookie: true
                # Routes accessibles pendant la phase 2FA (avant code saisi)
                whitelist_paths:
                    - ^/2fa
                    - ^/logout
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000  # 30 jours
                path: /
            # Rate-limiting login (protection brute-force)
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Contrôle d'accès (ACL) — ordre important (premier match gagne)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    access_control:
        # ── Routes publiques (Auth) ────────────────────────────────────
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/verify-email, roles: PUBLIC_ACCESS }

        # ── 2FA ───────────────────────────────────────────────────────
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }

        # ── Super-admin ───────────────────────────────────────────────
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_SUPER_ADMIN }

        # ── API publique (authentification JWT) ───────────────────────
        - { path: ^/api/auth/token, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

        # ── Onboarding (authentifié mais pas forcément onboardé) ──────
        - { path: ^/onboarding, roles: IS_AUTHENTICATED_FULLY }

        # ── Application principale ────────────────────────────────────
        - { path: ^/, roles: IS_AUTHENTICATED_FULLY }

    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # Role hierarchy (héritage de rôles intra-tenant)
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]
        ROLE_OWNER: [ROLE_ADMIN]
        ROLE_ADMIN: [ROLE_ACCOUNTANT]
        ROLE_ACCOUNTANT: [ROLE_VIEWER, ROLE_USER]
        ROLE_VIEWER: [ROLE_USER]
