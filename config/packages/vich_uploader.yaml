vich_uploader:
    db_driver: orm
    metadata:
        type: attribute
    # Tous les uploads transitent par S3StorageService
    # VichUploader est utilisé uniquement pour les logos (stockage local temporaire
    # avant envoi S3 par un listener)
    mappings:
        tenant_logo:
            uri_prefix: /uploads/logos
            upload_destination: '%kernel.project_dir%/var/uploads/logos'
            namer: Vich\UploaderBundle\Naming\UniqidNamer
            inject_on_load: false
            delete_on_update: true
            delete_on_remove: true
