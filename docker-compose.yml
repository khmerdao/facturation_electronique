version: '3.9'

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Infrastructure de développement
# Services : PostgreSQL 16, Redis 7, MinIO (S3), Mailpit (SMTP)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

services:

    # ── PHP-FPM + Symfony ────────────────────────────────────────────────────
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        volumes:
            - .:/var/www/html:cached
            - /var/www/html/vendor  # vendor dans le container uniquement
        environment:
            APP_ENV: dev
            DATABASE_URL: postgresql://facturation:secret@postgres:5432/facturation?serverVersion=16
            REDIS_URL: redis://redis:6379
            MAILER_DSN: smtp://mailpit:1025
            S3_ENDPOINT: http://minio:9000
            S3_PATH_STYLE_ENDPOINT: 'true'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks: [facturation]

    # ── Nginx ────────────────────────────────────────────────────────────────
    nginx:
        image: nginx:1.25-alpine
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on: [app]
        networks: [facturation]

    # ── PostgreSQL 16 ────────────────────────────────────────────────────────
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: facturation
            POSTGRES_USER: facturation
            POSTGRES_PASSWORD: secret
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U facturation -d facturation"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks: [facturation]

    # ── Redis 7 ──────────────────────────────────────────────────────────────
    redis:
        image: redis:7-alpine
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        volumes:
            - redis_data:/data
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        networks: [facturation]

    # ── MinIO (S3 compatible) ────────────────────────────────────────────────
    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        volumes:
            - minio_data:/data
        ports:
            - "9000:9000"   # API S3
            - "9001:9001"   # Console MinIO (http://localhost:9001)
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks: [facturation]

    # Crée les buckets MinIO au démarrage
    minio_init:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
                mc alias set local http://minio:9000 minioadmin minioadmin;
                mc mb --ignore-existing local/invoices;
                mc mb --ignore-existing local/attachments;
                mc mb --ignore-existing local/exports;
                mc mb --ignore-existing local/templates;
                mc policy set download local/templates;
                echo 'Buckets créés.'
            "
        networks: [facturation]

    # ── Mailpit (SMTP de test — UI sur http://localhost:8025) ────────────────
    mailpit:
        image: axllent/mailpit:latest
        ports:
            - "8025:8025"  # UI web
            - "1025:1025"  # SMTP
        networks: [facturation]

    # ── Workers Symfony Messenger ─────────────────────────────────────────────
    # En dev, les workers sont lancés manuellement :
    # docker compose exec app php bin/console messenger:consume async --time-limit=3600
    # En prod, supervisor gère les workers (voir docker/supervisor/)

volumes:
    postgres_data:
    redis_data:
    minio_data:

networks:
    facturation:
        driver: bridge
